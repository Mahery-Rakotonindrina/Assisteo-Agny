<!--
  Supabase → Authentication → Emails → Templates.
  Paste this into BOTH "Magic Link" and "Confirm signup" (the app signs in with
  the 6-digit code, never with the link). Subject: "Ton code Assisteo Agny : {{ .Token }}"
-->
<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body style="margin:0;padding:0;background:#f4f5f0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f5f0;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;background:#0b0c10;border-radius:24px;overflow:hidden;">
            <tr>
              <td style="padding:36px 32px 8px;text-align:center;">
                <div style="display:inline-block;width:56px;height:56px;line-height:56px;border-radius:16px;background:#c6ff4d;color:#0b0c10;font-size:28px;font-weight:700;">&#9673;</div>
                <p style="margin:18px 0 0;color:#9ca3af;font-size:13px;letter-spacing:0.12em;text-transform:uppercase;">Assisteo Agny</p>
                <h1 style="margin:8px 0 0;color:#f3f4f6;font-size:24px;font-weight:700;">Ton code de connexion</h1>
              </td>
            </tr>
            <tr>
              <td style="padding:24px 32px 8px;text-align:center;">
                <div style="display:inline-block;padding:16px 24px;border-radius:16px;background:#16181f;border:1px solid #2a2d36;color:#c6ff4d;font-size:34px;font-weight:700;letter-spacing:0.3em;font-family:'SFMono-Regular',Menlo,Consolas,monospace;">{{ .Token }}</div>
              </td>
            </tr>
            <tr>
              <td style="padding:16px 32px 32px;text-align:center;color:#d1d5db;font-size:15px;line-height:1.6;">
                Entre ce code dans l’app pour te connecter. Il expire dans une heure.
                <p style="margin:20px 0 0;color:#6b7280;font-size:13px;line-height:1.5;">
                  Tu n’as rien demandé ? Ignore cet e-mail : personne ne peut se connecter sans ce code.
                </p>
              </td>
            </tr>
          </table>
          <p style="margin:16px 0 0;color:#9ca3af;font-size:12px;">assisteo-agny.vercel.app</p>
        </td>
      </tr>
    </table>
  </body>
</html>
