name: Parcel tracking

# Every 3 hours, asks the server to check the followed parcels with 17TRACK
# (pages/api/cron/parcel-tracking.ts). Not more often: each new tracking
# number counts against the 17TRACK quota, and carriers rarely move faster.
# Needs the same CRON_SECRET and NEXT_PUBLIC_API_URL as the reminder pushes;
# without TRACK17_API_KEY on Vercel the route answers "skipped".
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

concurrency:
  group: parcel-tracking
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check followed parcels
        env:
          API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ] || [ -z "$API_URL" ]; then
            echo "::notice::CRON_SECRET or NEXT_PUBLIC_API_URL missing: parcel tracking is off."
            exit 0
          fi
          status=$(curl -s -o result.json -w "%{http_code}" --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" "$API_URL/api/cron/parcel-tracking")
          # The public log keeps no counts: only the status.
          echo "Parcel tracking cron answered HTTP $status"
          [ "$status" = "200" ] || { echo "::error::Parcel tracking cron answered HTTP $status"; exit 1; }
