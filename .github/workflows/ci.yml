name: CI

# Lint, types, unit tests and end-to-end tests on every push and pull request.
on:
  push:
    branches: [develop, master, main]
    paths-ignore: ["**.md"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (demo mode)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  # The migrations on an empty Postgres, then a backup of made-up data in
  # every table restored and read back: a new table or column that the
  # backups would miss fails here, before it reaches production.
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Backup restore test (sample data)
        env:
          CHECK_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: node scripts/db-restore-check.mjs --sample

      # The shared budget's Row Level Security, as Supabase runs it (its own database).
      - name: Row Level Security test (households)
        env:
          CHECK_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: node scripts/db-rls-check.mjs

  # The Android app still compiles (debug APK, never published, no secret):
  # only when the native side, the Capacitor config or the packages change.
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Native side changed?
        id: changes
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "android=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE" HEAD | grep -qE '^(android/|capacitor\.config\.|package(-lock)?\.json$)'; then
            echo "android=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No change under android/, capacitor.config.* or package*.json: APK build skipped."
            echo "android=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.changes.outputs.android == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - if: steps.changes.outputs.android == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - if: steps.changes.outputs.android == 'true'
        run: npm ci

      - if: steps.changes.outputs.android == 'true'
        run: npm run build:mobile

      - if: steps.changes.outputs.android == 'true'
        run: npx cap sync android

      - name: Build debug APK
        if: steps.changes.outputs.android == 'true'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
