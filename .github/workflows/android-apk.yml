# Builds the Android app in the cloud, so no Android SDK is needed locally.
# Each signed build is published as a GitHub release, so anyone can download
# the latest one at a fixed link (no GitHub account needed):
#   https://github.com/<owner>/<repo>/releases/latest/download/AssisteoAgny.apk
#
# Repository settings used (Settings → Secrets and variables → Actions):
# - variable NEXT_PUBLIC_API_URL: public URL of the deployed web build (the AI API).
# - secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
#   ANDROID_KEY_PASSWORD: release signing key. Without them a debug APK is built
#   (kept as a run artifact only: it can't update a signed install).
# - secret ADMIN_TOKEN (optional, the server's admin token): the new version and
#   its link are then set in Admin → "Versions de l'app", so installed apps
#   offer the update by themselves.
name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths-ignore: ["**.md"]

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      # Publish the APK as a release.
      contents: write
    env:
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      ANDROID_VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      # An APK without a reachable API installs fine but every scan fails,
      # so refuse to build one rather than ship a broken app.
      - name: Check API URL
        env:
          API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "::error::Set the repository variable NEXT_PUBLIC_API_URL to your public Vercel URL."
            exit 1
          fi
          status=$(curl -s -o health.json -w "%{http_code}" "$API_URL/api/health")
          if [ "$status" != "200" ]; then
            echo "::error::$API_URL/api/health answered HTTP $status. Use the production domain and make sure it isn't behind Vercel Authentication."
            exit 1
          fi
          echo "API OK: $(cat health.json)"

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: npm ci

      # Firebase config for reminder pushes (docs/push.md). Without it the
      # app is built without push and keeps local notifications only.
      - name: Restore Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::notice::No GOOGLE_SERVICES_JSON secret: building without push notifications."
            exit 0
          fi
          echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          echo "NEXT_PUBLIC_PUSH_ENABLED=true" >> "$GITHUB_ENV"

      - name: Build static export
        run: npm run build:mobile
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          # Public by design (protected by Row Level Security), needed for accounts.
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          # Optional: contact shown on the legal pages, and app error monitoring.
          NEXT_PUBLIC_CONTACT_EMAIL: ${{ vars.NEXT_PUBLIC_CONTACT_EMAIL }}
          NEXT_PUBLIC_PUBLISHER: ${{ vars.NEXT_PUBLIC_PUBLISHER }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}

      - run: npx cap sync android

      - name: Restore signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No signing secrets: building a debug APK, which Android flags as unsafe."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.p12"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          echo "release=true" >> "$GITHUB_OUTPUT"

      - name: Build signed release (APK + AAB)
        if: steps.signing.outputs.release == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon
          ls -la app/build/outputs/apk/release/
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          echo "Using $apksigner"
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk "../dist/AssisteoAgny-$ANDROID_VERSION_NAME.apk"
          cp app/build/outputs/bundle/release/app-release.aab "../dist/AssisteoAgny-$ANDROID_VERSION_NAME.aab"

      - name: Build debug APK (no signing key)
        if: steps.signing.outputs.release != 'true'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk "../dist/AssisteoAgny-$ANDROID_VERSION_NAME-debug.apk"

      - name: Remove signing key and Firebase config
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12" android/app/google-services.json

      - uses: actions/upload-artifact@v6
        with:
          name: assisteo-agny-android
          path: dist/*.apk
          retention-days: 30

      - uses: actions/upload-artifact@v6
        if: steps.signing.outputs.release == 'true'
        with:
          name: assisteo-agny-play-store-bundle
          path: dist/*.aab
          retention-days: 30

      # The APK under its version and under a fixed name: the "latest" link
      # always gives the newest signed build.
      - name: Publish the APK as a release
        if: steps.signing.outputs.release == 'true' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "dist/AssisteoAgny-$ANDROID_VERSION_NAME.apk" dist/AssisteoAgny.apk
          gh release create "v$ANDROID_VERSION_NAME" \
            dist/AssisteoAgny.apk "dist/AssisteoAgny-$ANDROID_VERSION_NAME.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Assisteo Agny $ANDROID_VERSION_NAME" \
            --notes "Sur un téléphone Android : télécharge AssisteoAgny.apk, ouvre-le et autorise l'installation." \
            --generate-notes
          echo "Download: https://github.com/$GITHUB_REPOSITORY/releases/latest/download/AssisteoAgny.apk"

      # Optional: the installed apps learn about this version (and where to get it).
      - name: Announce the version to the installed apps
        if: steps.signing.outputs.release == 'true' && github.event_name == 'push'
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: |
          if [ -z "$ADMIN_TOKEN" ]; then
            echo "::notice::No ADMIN_TOKEN secret: set the latest version ($ANDROID_VERSION_NAME) in Admin yourself."
            exit 0
          fi
          url="https://github.com/$GITHUB_REPOSITORY/releases/latest/download/AssisteoAgny.apk"
          # Keep the minimum version as it is; only the latest one and its link change.
          current=$(curl -sf -H "Authorization: Bearer $ADMIN_TOKEN" "$API_URL/api/admin/app")
          body=$(echo "$current" | jq -c --arg version "$ANDROID_VERSION_NAME" --arg url "$url" '.latest = $version | .downloadUrl = $url')
          curl -sf -X PUT -H "Authorization: Bearer $ADMIN_TOKEN" -H "Content-Type: application/json" -d "$body" "$API_URL/api/admin/app" > /dev/null
          echo "Installed apps now offer $ANDROID_VERSION_NAME."
