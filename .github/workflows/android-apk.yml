# Builds the Android app in the cloud, so no Android SDK is needed locally.
# Download it from the run's "Artifacts" section, then open it on an Android phone.
#
# Repository settings used (Settings → Secrets and variables → Actions):
# - variable NEXT_PUBLIC_API_URL: public URL of the deployed web build (the AI API).
# - secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
#   ANDROID_KEY_PASSWORD: release signing key. Without them a debug APK is built.
name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths-ignore: ["**.md"]

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      ANDROID_VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      # An APK without a reachable API installs fine but every scan fails,
      # so refuse to build one rather than ship a broken app.
      - name: Check API URL
        env:
          API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "::error::Set the repository variable NEXT_PUBLIC_API_URL to your public Vercel URL."
            exit 1
          fi
          status=$(curl -s -o health.json -w "%{http_code}" "$API_URL/api/health")
          if [ "$status" != "200" ]; then
            echo "::error::$API_URL/api/health answered HTTP $status. Use the production domain and make sure it isn't behind Vercel Authentication."
            exit 1
          fi
          echo "API OK: $(cat health.json)"

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: npm ci

      - name: Build static export
        run: npm run build:mobile
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}

      - run: npx cap sync android

      - name: Restore signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No signing secrets: building a debug APK, which Android flags as unsafe."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.p12"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          echo "release=true" >> "$GITHUB_OUTPUT"

      - name: Build signed release (APK + AAB)
        if: steps.signing.outputs.release == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon
          ls -la app/build/outputs/apk/release/
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          echo "Using $apksigner"
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk "../dist/AssisteoAgny-$ANDROID_VERSION_NAME.apk"
          cp app/build/outputs/bundle/release/app-release.aab "../dist/AssisteoAgny-$ANDROID_VERSION_NAME.aab"

      - name: Build debug APK (no signing key)
        if: steps.signing.outputs.release != 'true'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk "../dist/AssisteoAgny-$ANDROID_VERSION_NAME-debug.apk"

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"

      - uses: actions/upload-artifact@v4
        with:
          name: assisteo-agny-android
          path: dist/*.apk
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.release == 'true'
        with:
          name: assisteo-agny-play-store-bundle
          path: dist/*.aab
          retention-days: 30
